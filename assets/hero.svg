<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="MyGarage. Every vehicle. One intelligent garage." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0" r="0.65">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="1" r="0.6">
      <stop offset="0" stop-color="#3FCF8E" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3FCF8E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="fadeMask" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0.3" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="dotMask">
      <rect width="1200" height="440" fill="url(#fadeMask)"/>
    </mask>
    <clipPath id="card">
      <rect width="1200" height="440" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="#0B0D10"/>
    <rect width="1200" height="440" fill="url(#dots)" mask="url(#dotMask)"/>
    <rect width="1200" height="440" fill="url(#glowA)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect width="1200" height="440" fill="url(#glowB)">
      <animate attributeName="opacity" values="1;0.6;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="28" fill="none" stroke="#1E293B"/>

  <!-- status pill -->
  <rect x="462" y="48" width="276" height="38" rx="19" fill="#0EA5E9" fill-opacity="0.12" stroke="#0EA5E9" stroke-opacity="0.45"/>
  <circle cx="488" cy="67" r="5" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="506" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.2" fill="#7DD3FC">ACTIVE DEVELOPMENT</text>

  <!-- title -->
  <text x="600" y="188" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="-3" fill="url(#title)">MyGarage</text>

  <!-- tagline -->
  <text x="600" y="240" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#E2E8F0">Every vehicle. One intelligent garage.</text>
  <text x="600" y="276" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#94A3B8">Vehicles, documents and ownership tasks, organized in one connected workspace.</text>

  <!-- info cards -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="70" y="320" width="250" height="72" rx="14" fill="#111827" stroke="#1F2937"/>
    <text x="92" y="347" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">STATUS</text>
    <text x="92" y="372" font-size="18" font-weight="600" fill="#E2E8F0">Active development</text>

    <rect x="340" y="320" width="250" height="72" rx="14" fill="#111827" stroke="#1F2937"/>
    <text x="362" y="347" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">FOCUS</text>
    <text x="362" y="372" font-size="18" font-weight="600" fill="#E2E8F0">Document intelligence</text>

    <rect x="610" y="320" width="250" height="72" rx="14" fill="#111827" stroke="#1F2937"/>
    <text x="632" y="347" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">STACK</text>
    <text x="632" y="372" font-size="18" font-weight="600" fill="#E2E8F0">React · Supabase</text>

    <rect x="880" y="320" width="250" height="72" rx="14" fill="#111827" stroke="#1F2937"/>
    <text x="902" y="347" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">PLATFORM</text>
    <text x="902" y="372" font-size="18" font-weight="600" fill="#E2E8F0">Web + Android</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
